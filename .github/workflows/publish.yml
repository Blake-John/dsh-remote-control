name: publish

# 触发方式：推 v* 标签（例如 git push origin v2.1.0），或手动运行。
# 标签必须与 package.json 的版本一致，否则第一步就失败。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # npm provenance（可信发布）需要

# 同一个 ref 不并发发布，避免手动重跑与标签推送撞车。
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: 发布到 npm
    runs-on: ubuntu-latest
    env:
      # 配了 NPM_TOKEN 就用 token 发布；没配则走 npm 可信发布（OIDC）。
      # 两种路径互斥：OIDC 发布时不能带 NODE_AUTH_TOKEN。
      HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 环境自检
        run: |
          node -v
          npm -v

      - name: 标签与版本一致
        run: node scripts/check-manifest.mjs --tag "$GITHUB_REF_NAME"

      - name: 可发布性
        # private / @local 作用域 / publishConfig 都挡在这里，并给出可读原因。
        run: node scripts/check-manifest.mjs --publish

      - name: 测试
        run: npm test

      - name: 已发布则跳过
        id: guard
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version 已经发布过，跳过（重跑安全）"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布（NPM_TOKEN）
        if: steps.guard.outputs.published != 'true' && env.HAS_TOKEN == 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 发布（OIDC 可信发布）
        if: steps.guard.outputs.published != 'true' && env.HAS_TOKEN != 'true'
        # 需要在 npmjs.com 的包设置里把本仓库加为 Trusted Publisher，
        # 否则这一步会以 404/403 失败（包不存在时请先用 token 首发一次）。
        run: npm publish --access public --provenance

      - name: 结果摘要
        run: |
          echo "### ${{ steps.guard.outputs.published == 'true' && '已存在，跳过' || '已发布' }}" >> "$GITHUB_STEP_SUMMARY"
          node -p "require('./package.json').name + '@' + require('./package.json').version" >> "$GITHUB_STEP_SUMMARY"
